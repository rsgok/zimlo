name: Release iOS Beta

on:
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version, for example 0.3.0
        required: true
        type: string
      build_number:
        description: Monotonically increasing TestFlight build number
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-ios-beta
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ZIMLO_VERSION: ${{ inputs.version }}
      ZIMLO_BUILD_NUMBER: ${{ inputs.build_number }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate TestFlight configuration
        shell: bash
        env:
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          if [[ ! "$ZIMLO_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "version must be a semantic version such as 0.3.0" >&2
            exit 64
          fi
          if [[ ! "$ZIMLO_BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "build_number must be a positive integer" >&2
            exit 64
          fi
          missing=()
          for name in \
            APPLE_TEAM_ID APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_API_ISSUER_ID \
            APP_STORE_CONNECT_API_KEY_P8_BASE64 IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 \
            IOS_DISTRIBUTION_CERTIFICATE_PASSWORD IOS_KEYCHAIN_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing TestFlight configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Import iOS distribution certificate
        shell: bash
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/zimlo-ios-distribution.p12"
          keychain_path="$RUNNER_TEMP/zimlo-ios-signing.keychain-db"
          printf '%s' "$CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" \
            -P "$CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

      - name: Prepare App Store Connect key
        id: app_store_key
        shell: bash
        env:
          API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          printf '%s' "$API_KEY_P8_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          echo "path=$key_path" >> "$GITHUB_OUTPUT"

      - name: Archive signed iOS app
        run: |
          xcodebuild \
            -project apps/ios/Zimlo.xcodeproj \
            -scheme Zimlo \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Zimlo.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${{ steps.app_store_key.outputs.path }}" \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_API_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            MARKETING_VERSION="$ZIMLO_VERSION" \
            CURRENT_PROJECT_VERSION="$ZIMLO_BUILD_NUMBER" \
            clean archive

      - name: Upload build to TestFlight
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/Zimlo.xcarchive" \
            -exportPath "$RUNNER_TEMP/ZimloExport" \
            -exportOptionsPlist apps/ios/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${{ steps.app_store_key.outputs.path }}" \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_API_ISSUER_ID"

      - name: Remove temporary signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/zimlo-ios-signing.keychain-db" || true
