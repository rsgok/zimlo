[workspace]
members = [
  "crates/zimlo-bridge",
  "crates/zimlo-cli",
  "crates/zimlo-protocol",
  "crates/zimlo-store",
]
resolver = "3"

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.98"
license = "MIT"

[workspace.dependencies]
aes-gcm = "0.10"
axum = { version = "0.8", features = ["json", "ws"] }
base64 = "0.22"
chacha20poly1305 = "0.10.1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
getrandom = "0.3"
futures-util = "0.3"
hkdf = "0.12"
hmac = "0.12"
http-body-util = "0.1"
percent-encoding = "2"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
regex = "1"
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1", features = ["v7"] }
x25519-dalek = "2.0.1"
