<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f0e8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Zimlo" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Zimlo</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        const showStartupError = (detail) => {
          window.setTimeout(() => {
            const root = document.getElementById("root");
            if (!root || root.childElementCount > 0) return;
            const escaped = String(detail || "未知启动错误").replace(
              /[&<>]/g,
              (character) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[character],
            );
            root.innerHTML = `<main style="box-sizing:border-box;max-width:560px;margin:15vh auto;padding:24px;color:#332f2a;font:16px/1.6 system-ui,sans-serif"><h1 style="margin:0 0 12px;font-size:24px">Zimlo 启动失败</h1><p style="margin:0 0 8px">页面资源没有成功运行，请刷新页面或重启 Zimlo。</p><pre style="overflow-wrap:anywhere;white-space:pre-wrap;color:#8d352d">${escaped}</pre></main>`;
          }, 0);
        };
        window.addEventListener("error", (event) => showStartupError(event.message || "脚本加载失败"));
        window.addEventListener("unhandledrejection", (event) => showStartupError(event.reason?.message || event.reason));
        window.setTimeout(() => showStartupError("应用脚本未在 5 秒内完成初始化。"), 5000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
