<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <script>
      (() => {
        const query = new URLSearchParams(window.location.search);
        if (query.get("shell") !== "macos" || query.get("theme") !== "dark") return;
        document.documentElement.dataset.zimloShell = "macos";
        document.documentElement.dataset.theme = "dark";
        document.documentElement.classList.add("mac-dark");
      })();
    </script>
    <meta name="theme-color" content="#1d201a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Zimlo" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Zimlo</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        const showStartupError = (detail) => {
          window.setTimeout(() => {
            const root = document.getElementById("root");
            if (!root || root.childElementCount > 0) return;
            const escaped = String(detail || "未知启动错误").replace(
              /[&<>]/g,
              (character) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[character],
            );
            const dark = document.documentElement.dataset.theme === "dark";
            const panelStyle = dark
              ? "color:#edf1eb;background:#141915;border:1px solid rgba(235,244,237,.12);border-radius:18px"
              : "color:#332f2a";
            const errorColor = dark ? "#e39a91" : "#8d352d";
            root.innerHTML = `<main style="box-sizing:border-box;max-width:560px;margin:15vh auto;padding:24px;${panelStyle};font:16px/1.6 system-ui,sans-serif"><h1 style="margin:0 0 12px;font-size:24px">Zimlo 启动失败</h1><p style="margin:0 0 8px">页面资源没有成功运行，请刷新页面或重启 Zimlo。</p><pre style="overflow-wrap:anywhere;white-space:pre-wrap;color:${errorColor}">${escaped}</pre></main>`;
          }, 0);
        };
        window.addEventListener("error", (event) => showStartupError(event.message || "脚本加载失败"));
        window.addEventListener("unhandledrejection", (event) => showStartupError(event.reason?.message || event.reason));
        window.setTimeout(() => showStartupError("应用脚本未在 5 秒内完成初始化。"), 5000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
