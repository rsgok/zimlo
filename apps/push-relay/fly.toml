app = "zimlo-push-relay"
primary_region = "nrt"

[build]
  dockerfile = "apps/push-relay/Dockerfile"

[env]
  PORT = "8080"
  ZIMLO_PUSH_DATABASE = "/data/push-relay.sqlite"

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  auto_stop_machines = "stop"
  min_machines_running = 0

[[mounts]]
  source = "zimlo_push_data"
  destination = "/data"
