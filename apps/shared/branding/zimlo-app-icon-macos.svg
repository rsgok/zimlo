<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="background" cx="34%" cy="24%" r="92%">
      <stop offset="0" stop-color="#1A231E"/>
      <stop offset="0.58" stop-color="#101612"/>
      <stop offset="1" stop-color="#080C0A"/>
    </radialGradient>
    <linearGradient id="mac-end" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B7CD82"/>
      <stop offset="1" stop-color="#8DA760"/>
    </linearGradient>
    <linearGradient id="phone-end" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2EDE4"/>
      <stop offset="1" stop-color="#D8D1C5"/>
    </linearGradient>
    <filter id="tile-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
    <filter id="mark-shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
  </defs>

  <!-- macOS icons keep transparent breathing room around their own rounded tile. -->
  <rect x="72" y="72" width="880" height="880" rx="206"
        fill="url(#background)" filter="url(#tile-shadow)"/>
  <rect x="77" y="77" width="870" height="870" rx="201"
        fill="none" stroke="#34453A" stroke-width="10"/>

  <g transform="translate(512 512) scale(1.18) translate(-512 -512)" filter="url(#mark-shadow)">
    <path d="M438 324 H350 Q304 324 304 370 V654 Q304 700 350 700 H438"
          fill="none" stroke="url(#mac-end)" stroke-width="80"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M586 324 H676 Q720 324 720 368 V656 Q720 700 676 700 H586"
          fill="none" stroke="url(#phone-end)" stroke-width="70"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M430 512 H462 M562 512 H594"
          fill="none" stroke="#E5DED3" stroke-width="18" stroke-linecap="round"/>
    <circle cx="512" cy="512" r="50" fill="#111713" stroke="#111713" stroke-width="18"/>
    <circle cx="512" cy="512" r="38" fill="#DC765F"/>
    <circle cx="500" cy="499" r="9" fill="#F6B09E" opacity="0.48"/>
  </g>
</svg>
